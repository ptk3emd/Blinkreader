<!doctype html>
<html lang="pt-BR" data-theme="dark" style="background-color: #18181c; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        if (typeof window !== 'undefined') {
          window.global = window.global || window || globalThis;
          window.process = window.process || { 
            env: { NODE_ENV: 'production' },
            browser: true,
            version: '',
            nextTick: function(cb) { setTimeout(cb, 0); }
          };
          if (!window.Buffer) {
            window.Buffer = { isBuffer: function() { return false; } };
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uma palavra</title>
    <meta name="description" content="Leitor rápido RSVP focado em leitura dinâmica de uma palavra por vez e foco visual." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="theme-color" content="#18181c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <style>
      html, body {
        background-color: #18181c !important;
        color: #e8e8ec !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Urbanist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #root {
        min-height: 100vh;
        background-color: #18181c;
      }
      .initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #18181c;
        color: #e8e8ec;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #2e2e38;
        border-top-color: #FCFD76;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 12px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#18181c] text-[#e8e8ec] antialiased">
    <div id="root">
      <div class="initial-splash">
        <div class="initial-spinner"></div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
