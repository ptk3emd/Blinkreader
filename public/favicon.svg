<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242c" />
      <stop offset="100%" stop-color="#141418" />
    </linearGradient>
    <linearGradient id="yellowGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffff85" />
      <stop offset="100%" stop-color="#e2e342" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Tile (Squircle) -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="#33333c" stroke-width="2" />

  <!-- RSVP Reticle Focus Guides (Top & Bottom Center Notches) -->
  <line x1="32" y1="9" x2="32" y2="15" stroke="#FCFD76" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="49" x2="32" y2="55" stroke="#FCFD76" stroke-width="2.5" stroke-linecap="round" />

  <!-- Horizontal Sight Lines (Subtle Reading Frame) -->
  <line x1="12" y1="32" x2="22" y2="32" stroke="#454552" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="32" x2="52" y2="32" stroke="#454552" stroke-width="2" stroke-linecap="round" />

  <!-- Central Letter "U" (Uma) & Focal Point -->
  <!-- Left arm of U in soft white-slate -->
  <path d="M 23 23 L 23 35 C 23 40 27 42 32 42 C 37 42 41 40 41 35 L 41 23" 
        fill="none" 
        stroke="#e8e8ec" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- High-contrast RSVP Optimal Recognition Point (ORP) Glowing Center Accent -->
  <circle cx="32" cy="32" r="3.5" fill="url(#yellowGlow)" filter="url(#glow)" />
</svg>
